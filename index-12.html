  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      color: #f5f7ff;
      background:
        radial-gradient(circle at 50% 0%, rgba(26, 104, 180, .22), transparent 38%),
        linear-gradient(145deg, #05070d, #0b1220 55%, #05070d);
      display: flex;
      justify-content: center;
      padding: 22px 14px;
    }
    .page {
      width: min(100%, 760px);
      text-align: center;
    }
    .topline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #82c8ff;
      font-size: 12px;
      letter-spacing: 2px;
      border: 1px solid rgba(130, 200, 255, .25);
      background: rgba(15, 35, 60, .45);
      padding: 8px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: clamp(25px, 7vw, 48px);
      margin: 0;
      line-height: 1.25;
      background: linear-gradient(90deg, #d9f1ff, #56b8ff, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 28px rgba(49, 157, 255, .16);
    }
    .subtitle {
      color: #a8b9ce;
      margin: 10px 0 22px;
      font-size: clamp(14px, 3.5vw, 18px);
    }
    .image-card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(114, 191, 255, .35);
      background: #0b101b;
      box-shadow:
        0 0 0 5px rgba(57, 148, 224, .05),
        0 18px 70px rgba(0, 0, 0, .5),
        0 0 45px rgba(25, 128, 220, .12);
    }
    .image-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 65%, rgba(2, 5, 12, .6));
    }
    .hero {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }
    .caption {
      position: absolute;
      z-index: 2;
      bottom: 18px;
      right: 18px;
      left: 18px;
      text-align: right;
    }
    .caption strong {
      display: block;
      font-size: clamp(21px, 5vw, 34px);
      text-shadow: 0 2px 15px #000;
    }
    .caption span {
      color: #b7dfff;
      font-size: 13px;
    }
    .quote {
      margin: 20px 0 0;
      padding: 17px 18px;
      border-radius: 17px;
      background: rgba(16, 29, 48, .65);
      border: 1px solid rgba(130, 200, 255, .16);
      color: #d8e8f8;
      font-size: 14px;
      line-height: 2;
    }
    footer {
      color: #667d96;
      font-size: 11px;
      margin-top: 18px;
    }
